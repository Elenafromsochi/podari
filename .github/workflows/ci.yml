name: Проверка проекта

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: podari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_APP_ENV: test
      VITE_SUPABASE_URL: http://127.0.0.1:8100
      VITE_SUPABASE_PUBLISHABLE_KEY: test-anon-key
      SUPABASE_URL: http://127.0.0.1:8100
      SUPABASE_PUBLISHABLE_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      APP_URL: http://127.0.0.1:3100
      DISABLE_BACKGROUND_JOBS: "1"
      NITRO_PRESET: node-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Установить зависимости
        run: npm install --no-audit --no-fund
      - name: Проверить Supabase proxy
        run: npm run test:proxy
      - name: Проверить авторизацию
        run: npm run test:auth
      - name: Собрать Node.js-приложение
        run: npm run build

  deploy-staging:
    if: >-
      github.ref == 'refs/heads/staging' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Подключить ключ публикации
        shell: bash
        env:
          STAGING_SSH_KEY: ${{ secrets.PODARI_STAGING_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/podari_staging
          chmod 600 ~/.ssh/podari_staging
          cat > ~/.ssh/known_hosts <<'EOF'
          31.130.151.178 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOZ4PxYLfByHa3gOSD1rox4Te+Z2kcrP3a1Q1dHaLmIG
          EOF
      - name: Опубликовать проверенный commit в staging
        run: >-
          ssh -i ~/.ssh/podari_staging
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          podari-deploy@31.130.151.178 "deploy $GITHUB_SHA"
